<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f1efe9">
  <title>// AFICIONADXS ADMIN · REVIEW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="admin-header">
    <div>
      <div class="brand">// AFICIONADXS</div>
      <div class="sub">ADMIN · SUPABASE</div>
    </div>
    <div class="admin-actions">
      <span id="auth-status" class="sub"></span>
      <button id="sign-out" class="text-button" type="button" hidden>SIGN OUT</button>
      <a href="/" class="back">VIEW PUBLIC SITE →</a>
    </div>
  </header>

  <main>
    <section id="auth-gate" class="auth-gate" hidden></section>
    <div id="admin-app">
    <section class="intro">
      <div>
        <span class="eyebrow">PRIVATE WORKSPACE</span>
        <h1>CONTENT<br>REVIEW.</h1>
      </div>
      <div class="intro-note">
        <strong>LIVE ADMIN</strong>
        <p>Los cambios de metadatos, estados, publicación y producción se guardan en Supabase.</p>
        <p>Los archivos maestros permanecen privados y la web pública sigue separada.</p>
      </div>
    </section>

    <section class="summary" id="summary"></section>

    <nav class="tabs" aria-label="Admin sections">
      <button class="tab active" data-tab="queue">VALIDATION QUEUE</button>
      <button class="tab" data-tab="photos">PHOTOS</button>
      <button class="tab" data-tab="editions">APPAREL EDITIONS</button>
      <button class="tab" data-tab="applications">APPLICATIONS</button>
      <button class="tab" data-tab="physicals">PHYSICALS</button>
      <button class="tab" data-tab="production">PRODUCTION</button>
      <button class="tab" data-tab="costing">COSTING</button>
      <button class="tab" data-tab="settings">SETTINGS</button>
    </nav>

    <section id="panel"></section>
    </div>
  </main>

  <footer>
    <span>// AFCNDXS ARCHIVE</span>
    <span>REVIEW BUILD</span>
  </footer>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
