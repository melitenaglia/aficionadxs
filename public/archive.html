<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1efe9">
  <meta name="description" content="AFICIONADXS — archivo fotográfico completo. Imágenes, lugares y datos de captura.">
  <title>Archivo fotográfico — AFICIONADXS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20261010-editorial-home03">
</head>
<body data-page="archive">
  <header class="site-header">
    <a class="wordmark" href="/">// AFICIONADXS</a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/archive.html" data-i18n="navArchive">ARCHIVO</a>
      <a href="/#objects" data-i18n="navObjects">OBJETOS</a>
      <a href="/#info">INFO</a>
      <div class="language-switch" aria-label="Language">
        <button class="lang-toggle" data-lang="es" type="button">ES</button>
        <span>/</span>
        <button class="lang-toggle" data-lang="ca" type="button">CA</button>
        <span>/</span>
        <button class="lang-toggle" data-lang="en" type="button">EN</button>
      </div>

    </nav>
  </header>

  <main id="top">
    <section class="archive-section" id="archive">
      <div class="section-head">
        <h2 data-i18n="archiveHeading">// ARCHIVO</h2>
        <div class="archive-toolbar">
          <div class="archive-controls" aria-label="Country filter">
            <button class="filter active" data-filter="all" data-i18n="all">TODAS</button>
            <button class="filter" data-filter="AR">AR</button>
            <button class="filter" data-filter="BE">BE</button>
            <button class="filter" data-filter="CH">CH</button>
            <button class="filter" data-filter="CZ">CZ</button>
            <button class="filter" data-filter="DE">DE</button>
            <button class="filter" data-filter="DK">DK</button>
            <button class="filter" data-filter="ES">ES</button>
            <button class="filter" data-filter="FR">FR</button>
            <button class="filter" data-filter="GR">GR</button>
            <button class="filter" data-filter="IE">IE</button>
            <button class="filter" data-filter="IT">IT</button>
            <button class="filter" data-filter="MA">MA</button>
            <button class="filter" data-filter="NL">NL</button>
            <button class="filter" data-filter="PT">PT</button>
            <button class="filter" data-filter="US">US</button>
          </div>
          <div class="view-controls" aria-label="Archive view">
            <span data-i18n="view">VISTA</span>
            <button class="view-toggle active" data-view="grid" type="button" data-i18n="grid">GRID</button>
            <button class="view-toggle" data-view="carousel" type="button" data-i18n="carousel">CAROUSEL</button>
          </div>
        </div>
      </div>
      <div class="archive-grid" id="archive-grid" aria-live="polite"></div>
      <nav class="archive-pagination" id="archive-pagination" aria-label="Archive pagination">
        <button class="archive-page-button" id="archive-prev" type="button"><span aria-hidden="true">←</span> <span data-i18n="previous">ANTERIOR</span></button>
        <span class="archive-page-range" id="archive-page-range" aria-live="polite">1–20 / 76</span>
        <button class="archive-page-button archive-page-next" id="archive-next" type="button"><span data-i18n="next">SIGUIENTE</span> <span aria-hidden="true">→</span></button>
      </nav>
      <div class="archive-carousel" id="archive-carousel" hidden aria-live="polite">
        <button class="carousel-nav carousel-prev" id="carousel-prev" type="button" aria-label="Previous photograph">←</button>
        <div class="carousel-stage" id="carousel-stage"></div>
        <button class="carousel-nav carousel-next" id="carousel-next" type="button" aria-label="Next photograph">→</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-main">
      <span>// AFICIONADXS ARCHIVE</span>
      <div class="footer-links">
        <a class="footer-domain" href="/">AFICIONADXS.ART</a>
        <a class="footer-instagram" href="https://www.instagram.com/aficionadxs/" target="_blank" rel="noopener noreferrer">INSTAGRAM ↗</a>
      </div>
    </div>
    <div class="footer-meta">
      <span data-i18n="footerLine">FOTOGRAFÍA → OBJETO</span>
      <span>2017 — <span data-i18n="now">AHORA</span></span>
    </div>
  </footer>

  <dialog class="photo-dialog" id="photo-dialog">
    <button class="dialog-close" id="close-photo" type="button">×</button>
    <div id="photo-detail"></div>
  </dialog>



  <script type="module" src="/app.js?v=20261010-editorial-home03"></script>
</body>
</html>
